name: Second Workflow
on: 
    push:
    pull_request:
           
jobs:
    first_job:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                node-version: '20' # or your desired version
                cache: 'npm'       # or 'yarn' / 'pnpm'

            - name: Install dependencies
              run: npm ci
              
            - name: run ESLint in app
              run: npm run lint

            - name: Build project
              run: npm run build




              